{% extends "base.html" %}
{% block title %}Student Registration{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3" style="width: 56px; height: 56px;">
            <i class="bi bi-person-plus-fill fs-3"></i>
          </div>
          <h3 class="fw-bold mb-1">Student Registration</h3>
          <p class="text-muted small">Create your Malla Reddy University student leave management account</p>
        </div>

        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold small">Full Name</label>
              <input type="text" class="form-control" name="name" value="{{ form.get('name', '') }}" placeholder="e.g. A. Kumar" required minlength="3">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold small">Roll Number</label>
              <input type="text" class="form-control" name="roll_no" value="{{ form.get('roll_no', '') }}" placeholder="e.g. 22B81A0501" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold small">University Email</label>
            <input type="email" class="form-control" name="email" value="{{ form.get('email', '') }}" placeholder="student@university.edu" required>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold small">Department</label>
              <select class="form-select" name="department_id" required>
                <option value="">Select department</option>
                {% for d in departments %}
                <option value="{{ d.id }}" {{ 'selected' if form.get('department_id') == d.id|string }}>{{ d.name }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold small">Branch / Section</label>
              <select class="form-select" name="branch_id">
                <option value="">Select branch</option>
                {% for b in branches %}
                <option value="{{ b.id }}" {{ 'selected' if form.get('branch_id') == b.id|string }}>{{ b.name }}</option>
                {% endfor %}
              </select>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold small">Password</label>
              <input type="password" class="form-control" name="password" placeholder="At least 8 chars" required minlength="8">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold small">Confirm Password</label>
              <input type="password" class="form-control" name="confirm" placeholder="Repeat password" required minlength="8">
            </div>
          </div>

          <button class="btn btn-primary w-100 py-2 rounded-pill fw-semibold shadow-sm mt-2" type="submit">
            <i class="bi bi-person-check-fill me-1"></i> Register Student Account
          </button>
        </form>

        <div class="mt-4 pt-3 border-top text-center">
          <p class="small text-muted mb-0">Already registered? <a href="{{ url_for('auth.login') }}" class="fw-semibold text-decoration-none">Sign in here</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
